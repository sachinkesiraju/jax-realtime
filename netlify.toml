[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 requires a modern Node; pin it so builds don't fall back to an older default.
  NODE_VERSION = "22"

# jax-js's wasm backend multithreads via SharedArrayBuffer, which browsers only
# expose when the document is cross-origin isolated. Serve every response with
# COOP/COEP so the deployed site is isolated the same way the dev server is.
# HuggingFace weight downloads are CORS-enabled, so they keep working under
# require-corp.
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"

# Vite emits hashed, immutable asset filenames. Let browsers cache them for a
# year so repeat visits don't pay a revalidation round-trip for every chunk.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"

# The favicon and root HTML should revalidate quickly; keep them short-lived so
# deploys are picked up, but still carry the COOP/COEP isolation headers.
[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
